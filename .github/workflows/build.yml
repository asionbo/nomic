name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # arm64 runner; cross-compiles the x86_64 slice
            target: universal2
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      # --- macOS: both slices -> lipo -> nomic.app -> zip ---
      - name: Build and package (macOS)
        if: runner.os == 'Macos'
        shell: bash
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/nomic \
            target/x86_64-apple-darwin/release/nomic \
            -output nomic
          APP=nomic.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp scripts/macos/Info.plist "$APP/Contents/Info.plist"
          cp nomic "$APP/Contents/MacOS/nomic"
          # Ad-hoc signature: no Apple Developer account needed. Users must
          # still grant Accessibility (see README); Gatekeeper shows the
          # right-click -> Open path or `xattr -cr nomic.app`.
          codesign --force -s - "$APP"
          zip -qry nomic-macos-universal.zip "$APP"

      # --- Windows: exe -> zip (double-click to run, no installer needed) ---
      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          Compress-Archive -Path target/release/nomic.exe -DestinationPath nomic-windows-x86_64.zip

      # --- Linux: binary -> tar.gz ---
      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          tar -czf nomic-linux-x86_64.tar.gz -C target/release nomic

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

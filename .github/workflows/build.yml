name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: nomic-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: nomic-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nomic-windows-x86_64.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: nomic-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/nomic
            target/${{ matrix.target }}/release/nomic.exe
          if-no-files-found: error

<!doctype html>
<html lang="{{HTML_LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>{{TITLE}}</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --fg: #1c1e21; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111318; --card: #1b1e24; --fg: #e8eaed; --muted: #9aa1ac; --line: #2d323b; --accent: #6d9cff; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .card { max-width: 460px; margin: 0 auto; padding: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.06); }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p.sub { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
  .qr { display: block; width: min(260px, 100%); height: auto; margin: 0 auto 18px; background: #fff; padding: 10px; border-radius: 10px; }
  .url { display: flex; gap: 8px; align-items: stretch; margin: 0 0 14px; }
  .url input { flex: 1; min-width: 0; padding: 9px 10px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  button { padding: 9px 14px; font-size: 13px; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .note { margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; text-align: left; }
  .note b { color: var(--fg); }
  code { font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1>{{H1}}</h1>
  <p class="sub">{{SUB}}</p>
  <div id="qr">{{QR_SVG}}</div>
  <div class="url">
    <input id="link" readonly value="{{MOBILE_URL}}">
    <button id="copy" type="button">{{COPY}}</button>
  </div>
  <div class="note">
    <div><b>{{NOTE_TITLE}}</b></div>
    <div>{{NOTE1}}</div>
    <div>{{NOTE2}}</div>
    <div>{{NOTE3}}</div>
    <div>{{NOTE4}}</div>
    <div>{{NOTE5}}</div>
  </div>
</div>
<script>
  const COPY_LABEL = {{COPIED_JSON}};
  const btn = document.getElementById('copy');
  btn.addEventListener('click', async () => {
    const value = document.getElementById('link').value;
    try {
      await navigator.clipboard.writeText(value);
    } catch (_) {
      const el = document.getElementById('link');
      el.select();
      document.execCommand('copy');
    }
    btn.textContent = COPY_LABEL;
    setTimeout(() => { btn.textContent = {{COPY_JSON}}; }, 1500);
  });
</script>
</body>
</html>
